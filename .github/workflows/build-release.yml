name: Build & Release Single-File EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute Version (Starting from 1.0.0)
        id: vars
        shell: pwsh
        run: |
          $patch = [int]${{ github.run_number }} - 1
          if ($patch -lt 0) { $patch = 0 }
          $version = "1.0.$patch"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Version: $version (Tag: v$version)"

      - name: Restore Dependencies
        run: dotnet restore ZoteroWorkflowApp.csproj

      - name: Publish Single-File Self-Contained Executable
        shell: pwsh
        run: |
          $ver = "${{ steps.vars.outputs.VERSION }}"
          dotnet publish ZoteroWorkflowApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver `
            -p:AssemblyVersion="$ver.0" `
            -p:FileVersion="$ver.0" `
            -o ./dist

          Copy-Item "./dist/ZoteroWorkflowApp.exe" "./dist/ZoteroWorkflowApp-v$ver-win-x64.exe"

      - name: Upload Single-File EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoteroWorkflowApp-v${{ steps.vars.outputs.VERSION }}-win-x64
          path: |
            ./dist/ZoteroWorkflowApp.exe
            ./dist/ZoteroWorkflowApp-v${{ steps.vars.outputs.VERSION }}-win-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "Zotero AI Research Studio ${{ steps.vars.outputs.TAG }}"
          body: |
            Automated single-file build for **Zotero AI Research Studio ${{ steps.vars.outputs.TAG }}** (`win-x64`, self-contained `.NET 8` executable).
            - Commit: `${{ github.sha }}`
            - Run Number: `#${{ github.run_number }}`
          files: |
            ./dist/ZoteroWorkflowApp.exe
            ./dist/ZoteroWorkflowApp-v${{ steps.vars.outputs.VERSION }}-win-x64.exe
          generate_release_notes: true
